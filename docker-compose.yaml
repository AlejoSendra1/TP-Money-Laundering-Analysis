services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    logging:
      driver: none
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
    ports:
    - 5672:5672
    - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - INPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - OUTPUT_EXCHANGE_NAME=transactions_exchange
    - OUTPUT_TOPIC=transactions_topic
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - EOF_EXPECTED_BY_QUERY_1=2
    - EOF_EXPECTED_BY_QUERY_2=2
    - EOF_EXPECTED_BY_QUERY_3=2
    - EOF_EXPECTED_BY_QUERY_4=3
    - EOF_EXPECTED_BY_QUERY_5=2
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
      usd_filter_0:
        condition: service_started
      usd_filter_1:
        condition: service_started
      q5_date_filter_0:
        condition: service_started
      q5_date_filter_1:
        condition: service_started
    environment:
    - ID=0
    - BATCH_SIZE=200
    - INPUT_FILE=/datasets/input_0.csv
    - OUTPUT_FILE=/output/output_client_0/
    - WORKER_ID=client_0
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output
    - ./persistence:/persistence
  client_1:
