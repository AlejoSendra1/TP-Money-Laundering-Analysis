services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    logging:
      driver: none
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
    ports:
    - 5672:5672
    - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - INPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - OUTPUT_EXCHANGE_NAME=transactions_exchange
    - OUTPUT_TOPIC=transactions_topic
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - EOF_EXPECTED_BY_QUERY_1=0
    - EOF_EXPECTED_BY_QUERY_2=0
    - EOF_EXPECTED_BY_QUERY_3=0
    - EOF_EXPECTED_BY_QUERY_4=0
    - EOF_EXPECTED_BY_QUERY_5=2
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
      usd_filter_0:
        condition: service_started
      usd_filter_1:
        condition: service_started
      q5_date_filter_0:
        condition: service_started
      q5_date_filter_1:
        condition: service_started
    environment:
    - ID=0
    - BATCH_SIZE=200
    - INPUT_FILE=/datasets/input_0.csv
    - OUTPUT_FILE=/output/output_client_0/
    - WORKER_ID=client_0
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output
    - ./persistence:/persistence
  client_1:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_1
    depends_on:
      rabbitmq:
        condition: service_healthy
      gateway:
        condition: service_started
      usd_filter_0:
        condition: service_started
      usd_filter_1:
        condition: service_started
      q5_date_filter_0:
        condition: service_started
      q5_date_filter_1:
        condition: service_started
    environment:
    - ID=1
    - BATCH_SIZE=200
    - INPUT_FILE=/datasets/input_0.csv
    - OUTPUT_FILE=/output/output_client_1/
    - WORKER_ID=client_1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output
    - ./persistence:/persistence
  usd_filter_0:
    build:
      context: ./src/
      dockerfile: usd_filter/Dockerfile
    container_name: usd_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=usd_filter_0
    - INPUT_QUEUE=usd_filter_queue
    - INPUT_EXCHANGE_NAME=transactions_exchange
    - INPUT_TOPIC=transactions_topic
    - OUTPUT_EXCHANGE_NAME=usd_exchange
    - OUTPUT_TOPIC=usd_transactions_topic
    - CONTROL_EXCHANGE_NAME=usd_filter_control_exchange
    - CONTROL_TOPIC=usd_filter_control_topic
    volumes:
    - ./persistence:/persistence
  usd_filter_1:
    build:
      context: ./src/
      dockerfile: usd_filter/Dockerfile
    container_name: usd_filter_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=usd_filter_1
    - INPUT_QUEUE=usd_filter_queue
    - INPUT_EXCHANGE_NAME=transactions_exchange
    - INPUT_TOPIC=transactions_topic
    - OUTPUT_EXCHANGE_NAME=usd_exchange
    - OUTPUT_TOPIC=usd_transactions_topic
    - CONTROL_EXCHANGE_NAME=usd_filter_control_exchange
    - CONTROL_TOPIC=usd_filter_control_topic
    volumes:
    - ./persistence:/persistence
  q5_date_filter_0:
    build:
      context: ./src/
      dockerfile: q5_date_filter/Dockerfile
    container_name: q5_date_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      filter_payment_format_0:
        condition: service_started
      filter_payment_format_1:
        condition: service_started
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=q5_date_filter_0
    - INPUT_QUEUE=q5_date_filter_queue
    - INPUT_EXCHANGE_NAME=transactions_exchange
    - INPUT_TOPIC=transactions_topic
    - OUTPUT_QUEUE=filter_payment_format_queue
    - INSTANCE_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=q5_date_filter_control
    volumes:
    - ./persistence:/persistence
  q5_date_filter_1:
    build:
      context: ./src/
      dockerfile: q5_date_filter/Dockerfile
    container_name: q5_date_filter_1
    depends_on:
      rabbitmq:
        condition: service_healthy
      filter_payment_format_0:
        condition: service_started
      filter_payment_format_1:
        condition: service_started
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=q5_date_filter_1
    - INPUT_QUEUE=q5_date_filter_queue
    - INPUT_EXCHANGE_NAME=transactions_exchange
    - INPUT_TOPIC=transactions_topic
    - OUTPUT_QUEUE=filter_payment_format_queue
    - INSTANCE_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=q5_date_filter_control
    volumes:
    - ./persistence:/persistence
  filter_payment_format_0:
    build:
      context: ./src/
      dockerfile: filter_payment_format/Dockerfile
    container_name: filter_payment_format_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      currencies_cache_0:
        condition: service_started
      currencies_cache_1:
        condition: service_started
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=filter_payment_format_0
    - INPUT_QUEUE=filter_payment_format_queue
    - OUTPUT_QUEUE=currencies_cache
    - FILTER_AMOUNT=2
    - DATE_FILTER_AMOUNT=2
    - FILTER_PAYMENT_CONTROL=filter_payment_control
    - CONTROL_TOPIC=filter_payment_control_topic
    volumes:
    - ./persistence:/persistence
  filter_payment_format_1:
    build:
      context: ./src/
      dockerfile: filter_payment_format/Dockerfile
    container_name: filter_payment_format_1
    depends_on:
      rabbitmq:
        condition: service_healthy
      currencies_cache_0:
        condition: service_started
      currencies_cache_1:
        condition: service_started
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=filter_payment_format_1
    - INPUT_QUEUE=filter_payment_format_queue
    - OUTPUT_QUEUE=currencies_cache
    - FILTER_AMOUNT=2
    - DATE_FILTER_AMOUNT=2
    - FILTER_PAYMENT_CONTROL=filter_payment_control
    - CONTROL_TOPIC=filter_payment_control_topic
    volumes:
    - ./persistence:/persistence
  currencies_cache_0:
    build:
      context: ./src/
      dockerfile: currencies_cache/Dockerfile
    container_name: currencies_cache_0
    depends_on:
      rabbitmq:
        condition: service_healthy
      counter_q5_0:
        condition: service_started
      counter_q5_1:
        condition: service_started
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=currencies_cache_0
    - INPUT_QUEUE=currencies_cache
    - OUTPUT_PREFIX=counter_q5_queue
    - COUNTER_AMOUNT=2
    - FILTER_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=currencies_cache_control
    - CONTROL_TOPIC=currencies_cache_control_topic
    - CURRENCY_CODES_FILE=/currency_codes.json
    - FALLBACK_RATES_FILE=/bitcoin_usd_rates.json
    - EXCHANGE_RATE_API_URL=https://api.frankfurter.dev/v2/rates
    volumes:
    - ./src/currencies_cache/currency_codes.json:/currency_codes.json
    - ./src/currencies_cache/bitcoin_usd_rates.json:/bitcoin_usd_rates.json
    - ./persistence:/persistence
  currencies_cache_1:
    build:
      context: ./src/
      dockerfile: currencies_cache/Dockerfile
    container_name: currencies_cache_1
    depends_on:
      rabbitmq:
        condition: service_healthy
      counter_q5_0:
        condition: service_started
      counter_q5_1:
        condition: service_started
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=currencies_cache_1
    - INPUT_QUEUE=currencies_cache
    - OUTPUT_PREFIX=counter_q5_queue
    - COUNTER_AMOUNT=2
    - FILTER_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=currencies_cache_control
    - CONTROL_TOPIC=currencies_cache_control_topic
    - CURRENCY_CODES_FILE=/currency_codes.json
    - FALLBACK_RATES_FILE=/bitcoin_usd_rates.json
    - EXCHANGE_RATE_API_URL=https://api.frankfurter.dev/v2/rates
    volumes:
    - ./src/currencies_cache/currency_codes.json:/currency_codes.json
    - ./src/currencies_cache/bitcoin_usd_rates.json:/bitcoin_usd_rates.json
    - ./persistence:/persistence
  counter_q5_0:
    build:
      context: ./src/
      dockerfile: counter_q5/Dockerfile
    container_name: counter_q5_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=counter_q5_0
    - INPUT_PREFIX=counter_q5_queue
    - OUTPUT_QUEUE=results_queue
    - CACHE_AMOUNT=2
    volumes:
    - ./persistence:/persistence
  counter_q5_1:
    build:
      context: ./src/
      dockerfile: counter_q5/Dockerfile
    container_name: counter_q5_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_ID=counter_q5_1
    - INPUT_PREFIX=counter_q5_queue
    - OUTPUT_QUEUE=results_queue
    - CACHE_AMOUNT=2
    volumes:
    - ./persistence:/persistence
  watchdog_0:
    build:
      context: ./src/
      dockerfile: watchdog/Dockerfile
    container_name: watchdog_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_IDS=usd_filter_0,usd_filter_1,q5_date_filter_0,q5_date_filter_1,filter_payment_format_0,filter_payment_format_1,counter_q5_0,counter_q5_1,currencies_cache_0,currencies_cache_1,watchdog_0,watchdog_1,watchdog_2
    - ELECTION_EXCHANGE=watchdog_election
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  watchdog_1:
    build:
      context: ./src/
      dockerfile: watchdog/Dockerfile
    container_name: watchdog_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_IDS=usd_filter_0,usd_filter_1,q5_date_filter_0,q5_date_filter_1,filter_payment_format_0,filter_payment_format_1,counter_q5_0,counter_q5_1,currencies_cache_0,currencies_cache_1,watchdog_0,watchdog_1,watchdog_2
    - ELECTION_EXCHANGE=watchdog_election
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  watchdog_2:
    build:
      context: ./src/
      dockerfile: watchdog/Dockerfile
    container_name: watchdog_2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=2
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - WORKER_IDS=usd_filter_0,usd_filter_1,q5_date_filter_0,q5_date_filter_1,filter_payment_format_0,filter_payment_format_1,counter_q5_0,counter_q5_1,currencies_cache_0,currencies_cache_1,watchdog_0,watchdog_1,watchdog_2
    - ELECTION_EXCHANGE=watchdog_election
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
