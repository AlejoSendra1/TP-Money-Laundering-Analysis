services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - q5_date_filter_0
    environment:
    - BATCH_SIZE=10
    - INPUT_FILE=/datasets/input_5_query.csv
    - OUTPUT_FILE=/output/output_0.csv
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output

  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - INPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - OUTPUT_EXCHANGE_NAME=transactions_exchange
    - OUTPUT_TOPIC=transactions_topic
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
    logging:
      driver: none

  q5_date_filter_0:
    build:
      context: ./src/
      dockerfile: q5_date_filter/Dockerfile
    container_name: q5_date_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_QUEUE=q5_date_filter_queue
    - INPUT_EXCHANGE_NAME=transactions_exchange
    - INPUT_TOPIC=transactions_topic
    - OUTPUT_QUEUE=filter_payment_format_queue
    - INSTANCE_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=q5_date_filter_control

  q5_date_filter_1:
    build:
      context: ./src/
      dockerfile: q5_date_filter/Dockerfile
    container_name: q5_date_filter_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_QUEUE=q5_date_filter_queue
    - INPUT_EXCHANGE_NAME=transactions_exchange
    - INPUT_TOPIC=transactions_topic
    - OUTPUT_QUEUE=filter_payment_format_queue
    - INSTANCE_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=q5_date_filter_control

  filter_payment_format_0:
    build:
      context: ./src/
      dockerfile: filter_payment_format/Dockerfile
    container_name: filter_payment_format_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_QUEUE=filter_payment_format_queue
    - OUTPUT_QUEUE=currencies_cache
    - FILTER_AMOUNT=2
    - DATE_FILTER_AMOUNT=2
    - FILTER_PAYMENT_CONTROL=filter_payment_control
    - BATCH_SIZE=100

  filter_payment_format_1:
    build:
      context: ./src/
      dockerfile: filter_payment_format/Dockerfile
    container_name: filter_payment_format_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_QUEUE=filter_payment_format_queue
    - OUTPUT_QUEUE=currencies_cache
    - FILTER_AMOUNT=2
    - DATE_FILTER_AMOUNT=2
    - FILTER_PAYMENT_CONTROL=filter_payment_control
    - BATCH_SIZE=100

  counter_q5_0:
    build:
      context: ./src/
      dockerfile: counter_q5/Dockerfile
    container_name: counter_q5_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_PREFIX=counter_q5_queue
    - OUTPUT_QUEUE=results_queue
    - CACHE_AMOUNT=2
    - INSTANCE_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=counter_q5_control

  counter_q5_1:
    build:
      context: ./src/
      dockerfile: counter_q5/Dockerfile
    container_name: counter_q5_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_PREFIX=counter_q5_queue
    - OUTPUT_QUEUE=results_queue
    - CACHE_AMOUNT=2
    - INSTANCE_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=counter_q5_control

  currencies_cache_0:
    build:
      context: ./src/
      dockerfile: currencies_cache/Dockerfile
    container_name: currencies_cache_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_QUEUE=currencies_cache
    - OUTPUT_PREFIX=counter_q5_queue
    - COUNTER_AMOUNT=2
    - FILTER_AMOUNT=2
    - INSTANCE_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=currencies_cache_control
    - CURRENCY_CODES_FILE=/currency_codes.json
    - FALLBACK_RATES_FILE=/bitcoin_usd_rates.json
    - EXCHANGE_RATE_API_URL=https://api.frankfurter.dev/v2/rates
    volumes:
    - ./src/currencies_cache/currency_codes.json:/currency_codes.json
    - ./src/currencies_cache/bitcoin_usd_rates.json:/bitcoin_usd_rates.json

  currencies_cache_1:
    build:
      context: ./src/
      dockerfile: currencies_cache/Dockerfile
    container_name: currencies_cache_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_QUEUE=currencies_cache
    - OUTPUT_PREFIX=counter_q5_queue
    - COUNTER_AMOUNT=2
    - FILTER_AMOUNT=2
    - INSTANCE_AMOUNT=2
    - CONTROL_EXCHANGE_NAME=currencies_cache_control
    - CURRENCY_CODES_FILE=/currency_codes.json
    - FALLBACK_RATES_FILE=/bitcoin_usd_rates.json
    - EXCHANGE_RATE_API_URL=https://api.frankfurter.dev/v2/rates
    volumes:
    - ./src/currencies_cache/currency_codes.json:/currency_codes.json
    - ./src/currencies_cache/bitcoin_usd_rates.json:/bitcoin_usd_rates.json

