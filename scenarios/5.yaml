services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - q5_date_filter_0
    environment:
    - BATCH_SIZE = 10
    - INPUT_FILE=/datasets/input_0.csv
    - OUTPUT_FILE=/output/output_0.csv
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output
  q5_counter_0:
    build:
      context: ./src/
      dockerfile: counter/Dockerfile
    container_name: q5_counter_0
    depends_on:
    - currencies_cache_0
    - gateway
    environment:
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=q5_counter_queue
    - INPUT_TOPIC=q5_period_and_paymentformat_filtered_transaction_topic
    - OUTPUT_TOPIC=results_topic
    - PYTHONUNBUFFERED=1
  currencies_cache_0:
    build:
      context: ./src/
      dockerfile: currencies_cache/Dockerfile
    container_name: currencies_cache_0
    depends_on:
    - rabbitmq
    environment:
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
  q5_date_filter_0:
    build:
      context: ./src/
      dockerfile: date_filter/Dockerfile
    container_name: q5_date_filter_0
    depends_on:
    - payment_format_filter_0
    environment:
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=q5_date_filter_queue
    - INPUT_TOPIC=transactions_topic
    - OUTPUT_TOPIC=q5_period_transaction_topic
    - PYTHONUNBUFFERED=1
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - INPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - OUTPUT_EXCHANGE_NAME=transactions_exchange
    - OUTPUT_TOPIC=transactions_topic
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
  payment_format_filter_0:
    build:
      context: ./src/
      dockerfile: payment_format_filter/Dockerfile
    container_name: payment_format_filter_0
    depends_on:
    - q5_counter_0
    environment:
    - INPUT_QUEUE=payment_format_filter_queue
    - INPUT_TOPIC=q5_period_transaction_topic
    - MOM_HOST=rabbitmq
    - OUTPUT_TOPIC=q5_period_and_paymentformat_filtered_transaction_topic
    - PYTHONUNBUFFERED=1
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
