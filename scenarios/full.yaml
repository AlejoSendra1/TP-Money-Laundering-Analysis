    - OUTPUT_TOPIC=q5_date_topic
  filter_payment_format_0:
    build:
      context: ./src/
      dockerfile: filter_payment_format/Dockerfile
    container_name: filter_payment_format_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_QUEUE=filter_payment_format_queue_0
