    container_name: q4_join_0
    depends_on:
    - gateway
    environment:
    - ID=0
    - WORKER_PREFIX=q4_join
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_EXCHANGE_NAME=q4_join_exchange
    - OUTPUT_QUEUE_NAME=results_queue
    - PREV_FASE_WORKERS_AMOUNT=2
    - PYTHONUNBUFFERED=1
  q5_date_filter_0:
    build:
      context: ./src/
      dockerfile: q5_date_filter/Dockerfile
    container_name: q5_date_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - INPUT_QUEUE=q5_date_filter_queue
    - INPUT_EXCHANGE_NAME=transactions_exchange
    - INPUT_TOPIC=transactions_topic
